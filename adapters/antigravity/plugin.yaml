# Generated by scripts/Update-GeneratedDocs.ps1 from $operationMap (Invoke-TwinCATAutomation.ps1) and mcp-server/tools.json (#144).
# Do not edit by hand: run the script and commit the result.
name: twincat-automation
description: TwinCAT 3 IDE automation and PLC runtime control via PowerShell
version: 0.1.0
author: Lance0901

runtime:
  command: pwsh
  args:
    - Invoke-TwinCATAutomation.ps1
    - --operation
    - "{{operation}}"
    - --params
    - "{{params_json}}"

actions:
  - name: ConnectIde
    description: "Connect to a running TwinCAT XAE / Visual Studio instance (found through the Running Object Table); only if none is found does it launch a new XAE. SolutionPath is optional and opens that .sln after connecting. Call this before any project, build or runtime tool. Returns ideProcessId, connectSec (total seconds), launchSec (only when a new IDE was launched: seconds until DTE was ready) and, when a solution is open, the detected target AmsNetId. When the IDE that has SolutionPath open is blocked by a modal dialog or busy (its DTE answers RPC_E_CALL_REJECTED or an empty Version), it is recognised without COM and IDE_MODAL_DIALOG (or IDE_BUSY without a dialog) is returned with data.ideProcessId, data.dialog, data.matchedBy and data.attached; no second IDE is launched. matchedBy module-state (the IDE this server was connected to), session-record (an earlier ConnectIde saw this process with this solution) or dialog-path (the dialog names a file in the solution folder) attach that IDE (attached=true): GetIdeModalDialog / ResetSolution work on it right away. window-title (title = solution name only; may be a same-named copy elsewhere) does not attach (attached=false); when that IDE is not yours, LaunchIfBlocked=true ignores it and launches. After the dialog is closed the same ConnectIde call connects to it. Launching without ProgId (#72): the IDE is chosen from the TcVersion of every .tsproj the .sln references and launched only when its TwinCAT XAE version equals that TcVersion (data.progIdSelectedBy explicit / running-instance / tsproj-version / only-one-registered, evidence data.solutionVersion); otherwise nothing is launched: PROGID_REQUIRED (pass ProgId) or IDE_VERSION_NOT_REGISTERED. With several IDEs installed pass ProgId or a SolutionPath with a readable .tsproj TcVersion. Never a second IDE for a solution this session already launched (#136): that IDE is waited for (up to 60 s, also with NoLaunch) and attached (selectedBy session-launched), else IDE_LAUNCH_PENDING (data.probe; pid-unconfirmed = its pid could only be guessed, nothing attached: close it yourself, then DisconnectIde ForgetPendingLaunch=true; progid-mismatch = it was launched with another ProgId; other-session = launched by another TcAuto session, data.otherSession.hostState alive / gone). An IDE whose launching session has ended (hostState gone) is taken over only with TakeOverOrphan=true (#196; ask the user first whether anyone still works in it): solution, ended host, confirmed pid, the ROT DTE of that pid with the solution open and no modal dialog are all required, otherwise ORPHAN_TAKEOVER_REFUSED (data.reason) and nothing is attached; on success data.takenOver=true, data.previousOwner, ownedBySession=true. A reload prompt of that IDE (#201) is answered without reloading (solution Ignore, project No, file close) only when all of these hold: SolutionPath, a launch record of that .sln, its host and owner processes gone, confirmed pid, ProgId (when given) equal to the launch ProgId, the DTE of that pid in the ROT, and either that DTE has this .sln open or (DTE blocked) the prompt text names only files in the solution folder, or (no drive path in the text) the solution name in quotes. The first answer records reset-required for the .sln: BuildProject, EnableConfig, PlcLogin, SendPlcProgram, GenerateBootProject, SaveAsLibrary and every tool that saves a project file (AddPou, AddDut, AddGvl, AddInterface, AddLibrary, AddPlaceholder, FreezePlaceholder, RemoveReference, AddPlcTask, ImportPlcOpen, SetIndependentFile) return RESET_REQUIRED until ResetSolution (without SaveProjectChanges) reopened it from disk. On success data.reloadPromptAttempts, data.diskChangesNotLoaded=true, data.resetRequired (present = a prompt of this .sln was answered, now or earlier) and data.dirtyDocuments (unsaved editor documents: ResetSolution would drop them and refuses unless DiscardProjectChanges=true). Any other dialog, a prompt without that evidence or one that stays up: IDE_MODAL_DIALOG with nothing attached (ResetSolution / DisconnectIde would answer NOT_CONNECTED): ask the user to close it in XAE, then call TakeOverOrphan again."
    parameters:
      ProgId:
        type: string
        description: "COM ProgID to connect to / launch. When given, running instances with this ProgID are preferred and only this ProgID is used for launching. Without it the IDE to launch is derived from the .tsproj TcVersion of -SolutionPath; on a machine with several IDEs pass -SolutionPath or -ProgId (else PROGID_REQUIRED). An IDE this session launched for the same solution with another ProgID is not attached (IDE_LAUNCH_PENDING, data.progIdMismatch)."
        required: false
      SolutionPath:
        type: string
        description: "Path to a .sln file. If specified, the IDE will open this solution automatically after connecting (or connect to an instance already running this solution)."
        required: false
      NoLaunch:
        type: boolean
        description: "If set, do not launch a new IDE instance if none is running. With -SolutionPath an IDE this session launched for that solution and that is still starting is still waited for (up to 60 s) before IDE_LAUNCH_PENDING is returned."
        required: false
      LaunchIfBlocked:
        type: boolean
        description: "With -SolutionPath: ignore a blocked IDE that matches only by window title (matchedBy 'window-title', i.e. a same-named solution that may be someone else's) and go on as if it were not there (launch unless -NoLaunch). A blocked IDE recognised by strong evidence (module-state, session-record, dialog-path) is still reported."
        required: false
      TakeOverOrphan:
        type: boolean
        description: "With -SolutionPath (#196): take over the IDE that another TcAuto session launched for that solution after that session ended (IDE_LAUNCH_PENDING probe 'other-session', hostState 'gone'), so this session owns it (Disconnect-TcIde -Quit / -Kill). Only when the launch record of that .sln names a host process (bridge) that is gone AND an owner process (MCP server, ownerPid) that is gone too - a restarted bridge of a running session is refused (owner-alive / owner-unverifiable) -, its pid is confirmed, the ROT has that pid's DTE with this .sln open and no modal dialog is up; otherwise nothing is attached (ORPHAN_TAKEOVER_REFUSED with data.reason, IDE_MODAL_DIALOG / MODAL_SCAN_INCOMPLETE, or LAUNCH_RECORD_UNAVAILABLE). #201: a known reload prompt (kind reload-prompt) of that IDE is answered without reloading (solution: Ignore only, project: No, file: WM_CLOSE; at most 5 prompts) only when: -SolutionPath given, a launch record of that .sln, its host and owner processes gone, its pid confirmed, -ProgId (when given) the launch ProgID, the pid's DTE in the ROT, and either that DTE answered with this .sln open or - DTE blocked - the dialog text names only files inside the solution folder, or (no drive path in the text at all) the solution name in quotes ('<name>'). Then the DTE is read again and BUILD_REQUIRED kind reset-required is recorded for the .sln (Build-TcProject, Enable-TcConfig, Enter-TcPlcOnline, New-TcBootProject, Save-TcPlcLibrary and every project-file save refuse with RESET_REQUIRED until Reset-TcSolution reopened it from disk). On success data.reloadPromptAttempts, data.diskChangesNotLoaded = true, data.resetRequired (the record: the field that says a prompt of this .sln was answered, now or by an earlier takeover) and data.nextStep; every takeover also lists unsaved editor documents (data.dirtyDocuments, Document.Saved = false; data.dirtyDocumentsError when unreadable): Reset-TcSolution would close them without saving and refuses while any exists unless -DiscardProjectChanges. Any other dialog (also one found after the attach), a prompt without that evidence or one that stays up: IDE_MODAL_DIALOG with the IDE_MODAL_DIALOG_ORPHAN hint (nothing attached, so not Reset-TcSolution / Disconnect-TcIde); every failed exit carries data.reloadPromptAttempts / data.resetRequired like the success. Only after the attach, the modal check and the project scan have passed does the record get this process as owner plus a takeovers[] entry; data.takenOver = true, data.previousOwner. Use it only after the user confirmed nobody still works in that IDE."
        required: false

  - name: DisconnectIde
    description: "Release the DTE/COM references held by the bridge. The IDE keeps running unless Quit=true, which closes the solution without saving and quits the IDE (only use on an IDE that ConnectIde launched). With Quit=true a modal dialog is checked first: if one is up nothing is attempted, nothing is released (the connection stays: for kind reload-prompt run ResetSolution, then DisconnectIde Quit=true again) and the result is IDE_QUIT_FAILED (data.dialog {title, text, kind, reloadTarget}, quit=false, disconnected=false); if DTE.Quit fails the result is also IDE_QUIT_FAILED (success=false, data.ideProcessId / quitError; the IDE process still runs). After a failure the IDE pid is kept, so DisconnectIde Quit=true Kill=true can follow directly without ConnectIde. Kill=true (only with Quit=true) kills the IDE process in those two cases, but only when this session launched it (data.ownedBySession, still true after the internal reconnect of ResetSolution), otherwise IDE_NOT_OWNED and nothing is killed; data.killed tells whether it was killed. COM references are always released. ForgetPendingLaunch=true (alone) only forgets the launch records whose pid could not be confirmed (ConnectIde IDE_LAUNCH_PENDING probe pid-unconfirmed): nothing is closed, the connection is kept (data.forgottenLaunches)."
    parameters:
      Quit:
        type: boolean
        description: "true = also close the solution (without saving) and quit the IDE."
        required: false
      Kill:
        type: boolean
        description: "Only with Quit=true: kill the IDE process when it cannot be quit (modal dialog, DTE.Quit failed). Only for an IDE this session launched (data.ownedBySession); any other IDE -> IDE_NOT_OWNED, nothing killed."
        required: false
      ForgetPendingLaunch:
        type: boolean
        description: "Only forget the launch records of IDEs this session launched whose process id could not be confirmed (Connect-TcIde IDE_LAUNCH_PENDING with data.probe 'pid-unconfirmed'), also the ones persisted in launched-ides.json by an earlier module instance / bridge (#149), so the next Connect-TcIde -SolutionPath may launch again. Closes nothing, keeps the connection (data.forgottenLaunches; LAUNCH_RECORD_UNAVAILABLE when the file could not be updated; records of another TcAuto session that is still running are kept, data.otherSessionLaunches). Close that IDE yourself first if it is still running. Not with -Quit / -Kill (INVALID_PARAMS)."
        required: false

  - name: ResetSolution
    description: "Reload every project file from disk: dismisses the reload prompt if it is up (data.dismissedReloadPrompt). The XAE project prompt \"The project file ... has been modified outside of TwinCAT XAE. Do you want to reload the project?\" (a rewritten .plcproj; GetIdeModalDialog kind reload-prompt, reloadTarget project) is answered Yes by dialog control id (any UI language) and XAE reloads the project itself: then only ConnectIde runs again, no close / reopen (data.answeredYes=true, data.reopenedSolution=false, data.reloadTarget). A failed Yes is tried once more, then No (control id 7) with a full close / reopen; no WM_CLOSE (an MB_YESNO box ignores it, measured 2026-11-07); every attempt is in data.reloadPromptAttempts, each waits at most what is left of TimeoutSec. The VS2022 solution prompt (a rewritten .sln; reloadTarget solution, recognised by button control ids 259 Reload + 1412 Ignore, measured VS2022 zh-TW) is answered Ignore (control id 1412), then the solution is closed and reopened from disk; not Reload: measured 2026-11-07 (4026 VS2022), Reload made VS ask at once to save the .tsproj left dirty by SetTarget. Before success the solution is read back until it is loaded again (data.loadCheck: FullName, IsOpen, SolutionBuild.ActiveConfiguration and, when the .sln references a .tsproj, TIPC with the PLC names the .tsproj lists; expectedFrom disk / memory / none); not loaded within TimeoutSec -> SOLUTION_RELOAD_INCOMPLETE, IDE crashed meanwhile -> IDE_CRASHED; a reload prompt that comes up during this readback is answered like the first one (at most 5 prompts per call, shared TimeoutSec), any other dialog -> IDE_MODAL_DIALOG. A reconnect answering MODAL_SCAN_INCOMPLETE is retried up to 3 times (data.reconnectAttempts). Otherwise it closes all documents without saving (data.closedDocuments), Solution.Close, Solution.Open of the same .sln on the same IDE, then ConnectIde again (20-25 s in total, data.totalSec). Use right after .TcPOU / .plcproj files were changed ON DISK by another tool while they are open in an XAE editor: otherwise XAE shows the modal \"File has been changed outside the environment. Reload the new file?\" (GetIdeModalDialog kind reload-prompt) and every call blocks. A file that is not open in an editor is picked up automatically within ~5 s and needs no call; WritePouCode / AddPou write through COM and never need it. Before closing, the PLC objects in XAE are compared with the .plcproj on disk (data.projectCheck, per PLC: checked, missingOnDisk [file, relativePath, fileExists], extraOnDisk, complete; a PLC whose .plcproj cannot be located, e.g. an independent .xti project file, gets checked=false + reason and is skipped). Nothing is saved by default: an object that XAE has and the .plcproj does not list cannot be told apart from one deleted on disk, so any missingOnDisk returns PROJECT_UNSAVED_CHANGES and nothing is saved or closed (extraOnDisk alone does not block: the reopen loads the disk version, XAE loses nothing). SaveProjectChanges=true keeps the XAE version: ONLY the project files are saved (.tsproj / .plcproj, DTE Project.Save with a deadline, PROJECT_SAVE_TIMEOUT) and read back (data.savedProjects); it is still refused (PROJECT_UNSAVED_CHANGES, data.saveRefused, plc '*' = not one PLC) when a reload prompt was handled first, the .TcPOU / .TcDUT / .TcGVL is missing at its relative path on disk, or any PLC of the same .tsproj (Project.Save writes every .plcproj below it) could not be compared, was compared incompletely or lists objects XAE does not have. DiscardProjectChanges=true keeps the disk version (closes anyway, XAE-only objects are dropped). The two exclude each other (INVALID_PARAMS). After ConnectIde TakeOverOrphan answered a reload prompt (reset-required) it also refuses with PROJECT_UNSAVED_CHANGES while the IDE has unsaved editor documents (data.dirtyDocuments) or they cannot be read (data.dirtyDocumentsError): closing would drop them; DiscardProjectChanges=true goes on. Do not use BuildProject to resolve it (whether a build also saves PLC editor buffers is an inference, not measured). What else Project.Save writes (measured 2026-10-28, 4026 VS2022): a dirty plain text document is NOT saved; whether unsaved content of a PLC editor (a POU edited in the GUI) is written was NOT verified. Unsaved library references / tasks / I/O are not detected. Any other modal dialog is reported as IDE_MODAL_DIALOG. Dialogs are checked before Solution.FullName is read and again after every poll of it that got no answer, so a reload prompt that XAE shows a few seconds after the disk change is handled in the poll and another dialog returns IDE_MODAL_DIALOG at once instead of RESET_SOLUTION_UNVERIFIED after TimeoutSec. A prompt that comes up later (during the project file check, before or during Documents.CloseAll / Solution.Close) is handled the same way: the reset starts over from the dialog step (nothing is closed before Solution.Close succeeds) and another dialog returns IDE_MODAL_DIALOG instead of PROJECT_SAVE_FAILED / SOLUTION_CLOSE_FAILED (#87; real-machine check pending). The ADS connection is kept. BUILD_REQUIRED (#65): a reload from disk (the files may have been changed outside the module) records kind code-changed for the open solution (data.buildRequired names the tool and the .sln; data.stateWarning when the state file could not be written): EnableConfig / PlcLogin / SendPlcProgram then refuse with BUILD_REQUIRED until BuildProject returns data.completeBuild=true."
    parameters:
      SolutionPath:
        type: string
        description: ".sln to reopen. Default: the solution ConnectIde / OpenProject opened."
        required: false
      TimeoutSec:
        type: integer
        minimum: 5
        maximum: 600
        description: "Expected upper bound for each of Documents.CloseAll, Solution.Close and Solution.Open, and the total time Solution.FullName is polled in one call (wait after a Yes reload, solution check), in seconds (default 120)."
        required: false
        default: 120
      DiscardProjectChanges:
        type: boolean
        description: "true = keep the disk version: skip the project file check and close without saving even when PLC objects in XAE are missing from the .plcproj on disk (they are dropped). Use after PROJECT_UNSAVED_CHANGES when the disk version is the one to keep. Not together with SaveProjectChanges."
        required: false
      SaveProjectChanges:
        type: boolean
        description: "true = keep the XAE version: objects in XAE that the .plcproj on disk does not list are saved (project files only) before closing. Refused (PROJECT_UNSAVED_CHANGES, data.saveRefused) when the disk shows a change: a reload prompt was handled, an object file is missing on disk, or any PLC of the same .tsproj (Project.Save writes all of them) could not be compared, was compared incompletely or its .plcproj lists objects XAE does not have. Not together with DiscardProjectChanges."
        required: false

  - name: GetIdeInfo
    description: "Return version, edition, open solution, ITcSysManager availability and the active solution platform / configuration (solutionPlatform, solutionConfiguration; null when unreadable) of the connected IDE. Cheap connectivity check; fails with NOT_CONNECTED before ConnectIde."

  - name: GetIdeModalDialog
    description: "Report the modal dialog blocking the IDE (data.scanComplete true + data.dialog null when none; an unfinished scan is MODAL_SCAN_INCOMPLETE, unknown, not none). Works while DTE calls fail with IDE_BUSY. On MCP this is a composite tool."
    parameters:
      ProcessId:
        type: integer
        description: "IDE process id (default: the connected IDE)"
        required: false
      TimeoutSec:
        type: integer
        minimum: 1
        maximum: 60
        description: "How long to probe for a dialog (1..60, default 5)."
        required: false
        default: 5

  - name: GetAutomationVersion
    description: "Read-only and offline: which TwinCATAutomation this server runs (#30). Module installed by TwinCATSetup-Claude/Codex/Antigravity.ps1: read from tcauto-install-manifest.json in the skill folder (data.installed=true, source=install-manifest): name, sourceUrl, version, release, commit, ref, commitSource (git / release-stamp / unknown), installer, installedAt, sourcePath, fileCount. Server started from the repository: installed=false, source=source-tree, version from the .psd1 and commit from the .git files (git is not started; uncommitted changes are not detected). data.moduleVersion / modulePath describe the loaded module. Verify=true compares every installed file with the SHA256 in the manifest (data.verify: ok, checked, matched, mismatched [path, expected, actual], missing, extra, unreadable [path, error]): a difference returns INSTALL_MANIFEST_MISMATCH, no manifest INSTALL_MANIFEST_NOT_FOUND, an unreadable manifest INSTALL_MANIFEST_INVALID. Include version and commit when reporting an issue."
    parameters:
      Verify:
        type: boolean
        description: "Also compare the installed files with the SHA256 hashes recorded in the install manifest (detects an accidental or partial change of the installed copy)."
        required: false

  - name: NewProject
    description: "Create new TwinCAT project with PLC and MAIN program. #70: only on an IDE with no solution open (otherwise SOLUTION_ALREADY_OPEN, nothing created); not offered on the MCP server."
    parameters:
      Name:
        type: string
        description: "Project name"
        required: true
      Path:
        type: string
        description: "Target directory"
        required: false

  - name: OpenProject
    description: "Open a solution (.sln) in the connected IDE and wait until the TwinCAT project is loaded."
    parameters:
      Path:
        type: string
        description: "Path to the .sln or .tsproj file."
        required: true

  - name: GetProjectTree
    description: "Read the project tree. Every node has name, path, type, itemType, subType and children; path can be passed as-is to GetPouCode / WritePouCode PouPath. type is the item kind from ItemType (Project, Folder, FunctionBlock, Function, Program, Dut, Gvl, Task, References ...) or the numeric ItemType when unknown (itemType / subType are also returned as numbers). The PLC node TIPC^<Plc> also lists \"<Plc> Project\" with its POUs, DUTs and GVLs folders (on 4024 and 4026 the project node is hidden from enumeration and is added by path). Depth (default 4) = levels below each root, enough for TIPC^<Plc>^<Plc> Project^POUs^<POU>; a node at the depth limit that still has children comes back with children=[] and truncated=true. In the TIID section every node lists only its direct children: the terminals that ITcSmTreeItem.Child(i) of an EtherCAT device also returns below a coupler (measured 2026-11-08, 4024 XAE) are not listed a second time below the device (#186). A busy / crashed IDE while reading the tree -> IDE_BUSY / IDE_CRASHED / IDE_MODAL_DIALOG / IDE_TIMEOUT, never a partial tree. PlcOnly=true returns only the TIPC subtree."
    parameters:
      Depth:
        type: integer
        minimum: 1
        maximum: 10
        description: "Levels below each root node (1-10, default 4). 4 reaches the POUs: TIPC(0)^<Plc>(1)^<Plc> Project(2)^POUs(3)^<POU>(4). Nodes at the limit that have children return truncated=true."
        required: false
        default: 4
      PlcOnly:
        type: boolean
        description: "true = return only the TIPC (PLC) subtree."
        required: false

  - name: AddPou
    description: "Create a POU (Program, FunctionBlock or Function, language ST) in <Plc> Project^POUs (or PlcProjectPath) and read it back: success only when the new item is found with the expected kind. data: path, folderPath, objectKind (POU), itemType (602 Program / 603 Function / 604 FunctionBlock), language (read back from the new item, must be ST), declaration (default header written by XAE; a Function header must contain : ReturnType). Then fill it with WritePouCode. A POU / DUT / GVL / ITF with the same name anywhere in the same PLC project -> POU_CREATE_FAILED with its path (nothing created; data.duplicateCheckScope = project, or folder when the project has more than 3000 nodes); a failed readback names the step and that the object stays in the tree (error.hint says what to do). A modal dialog in XAE -> IDE_MODAL_DIALOG before anything is created. BUILD_REQUIRED (#65): a created POU (also one whose readback failed) records kind code-changed for the open solution (data.buildRequired names the tool and the POU; data.stateWarning when the state file could not be written): EnableConfig / PlcLogin / SendPlcProgram then refuse with BUILD_REQUIRED until BuildProject returns data.completeBuild=true. Project file (#76): CreateChild changes the .plcproj only in XAE memory, so after the readback the project files are saved (DTE Project.Save of the .tsproj, with a deadline: PROJECT_SAVE_TIMEOUT + data.saveDiagnostics) and the .plcproj is read back from disk: success only when it has a <Compile Include> with the relative path of the object <folders>\\<Name>.TcPOU (data.projectSaved: plc, plcproj, tsproj, savedFiles, verifiedFiles [file, preExisting], plcprojChanged, lastWriteBefore, lastWriteAfter, saveSec, warning); otherwise PROJECT_SAVE_FAILED (data.objectPath, createdInMemory=true, savedToDisk=false: the object exists only in XAE memory; error.hint gives the next step, also when the .plcproj cannot be located) or IDE_MODAL_DIALOG. What else Project.Save writes (measured 2026-10-28, 4026 VS2022): a dirty plain text document is NOT saved; whether unsaved content of a PLC editor (a POU edited in the GUI) is written was NOT verified. PLC still logged in (XAE: Cannot add an object because it affects a device you are currently logged into, measured 2026-10-29 4026 VS2022) -> PLC_LOGGED_IN, nothing created and no BUILD_REQUIRED recorded: PlcLogout first, then call it again."
    parameters:
      Name:
        type: string
        description: "POU name (e.g., FB_Motor, FC_Add, MAIN)."
        required: true
      Type:
        type: string
        enum: ["Program", "FunctionBlock", "Function"]
        description: "POU type: Program, FunctionBlock, or Function."
        required: true
      ReturnType:
        type: string
        description: "Return type for Functions (e.g., INT, BOOL). Ignored for Program/FunctionBlock."
        required: false
        default: "BOOL"
      PlcProjectPath:
        type: string
        description: "Tree path of the folder the POU is created in, e.g. TIPC^<Plc>^<Plc> Project^POUs (same on 4024 and 4026). Omit to auto-detect (<Plc> Project^POUs, else the <Plc> Project node; see data.folderPath)."
        required: false

  - name: AddGvl
    description: "Create a GVL in <Plc> Project^GVLs, write VAR_GLOBAL ... END_VAR from Variables and read it back. Variables is an ARRAY in declaration order (#47): [{\"name\":\"bStart\",\"type\":\"BOOL\"},{\"name\":\"nCount\",\"type\":\"INT\",\"init\":\"0\",\"comment\":\"...\"}]; the old object form {\"bStart\":\"BOOL\"} is not accepted (INVALID_PARAMS: object key order is not kept). An invalid entry (name not an identifier, duplicate name, missing type, unknown key) -> INVALID_PARAMS, nothing created. After saving, the declaration read back is parsed and its variable order compared with the input: a difference -> MEMBER_ORDER_MISMATCH (data.expectedOrder, data.actualOrder, data.declaration; the GVL exists, fix it with WritePouCode), never success; on success data.memberOrder is the order read back. data: path, objectKind (GVL), itemType 615, declaration, memberOrder. A name that already exists or a declaration that reads back different -> GVL_CREATE_FAILED. Change it later with WritePouCode Declaration only (a GVL has no implementation). BUILD_REQUIRED (#65): a created GVL (also one whose readback failed) records kind code-changed for the open solution (data.buildRequired names the tool and the GVL; data.stateWarning when the state file could not be written): EnableConfig / PlcLogin / SendPlcProgram then refuse with BUILD_REQUIRED until BuildProject returns data.completeBuild=true. Project file (#76): CreateChild changes the .plcproj only in XAE memory, so after the readback the project files are saved (DTE Project.Save of the .tsproj, with a deadline: PROJECT_SAVE_TIMEOUT + data.saveDiagnostics) and the .plcproj is read back from disk: success only when it has a <Compile Include> with the relative path of the object <folders>\\<Name>.TcGVL (data.projectSaved: plc, plcproj, tsproj, savedFiles, verifiedFiles [file, preExisting], plcprojChanged, lastWriteBefore, lastWriteAfter, saveSec, warning); otherwise PROJECT_SAVE_FAILED (data.objectPath, createdInMemory=true, savedToDisk=false: the object exists only in XAE memory; error.hint gives the next step, also when the .plcproj cannot be located) or IDE_MODAL_DIALOG. What else Project.Save writes (measured 2026-10-28, 4026 VS2022): a dirty plain text document is NOT saved; whether unsaved content of a PLC editor (a POU edited in the GUI) is written was NOT verified. PLC still logged in (XAE: Cannot add an object because it affects a device you are currently logged into, measured 2026-10-29 4026 VS2022) -> PLC_LOGGED_IN, nothing created and no BUILD_REQUIRED recorded: PlcLogout first, then call it again."
    parameters:
      Name:
        type: string
        description: "GVL name (e.g., GVL_Main)."
        required: true
      Variables:
        type: array
        items:
          type: object
        description: "Variables in declaration order (array; the order is kept and verified on readback, #47): [{\"name\":\"bStart\",\"type\":\"BOOL\"},{\"name\":\"nCount\",\"type\":\"INT\",\"init\":\"0\",\"comment\":\"counter\"}] (name and type required)."
        required: false

  - name: AddDut
    description: "Create a DUT (Struct / Enum / Union / Alias) in <Plc> Project^DUTs, write its declaration (TYPE ... END_TYPE from Fields / AliasType; an Enum without Fields gets enum_member := 0) and read it back. Fields is an ARRAY in declaration order (#47): Struct / Union [{\"name\":\"bStart\",\"type\":\"BOOL\"},{\"name\":\"nCount\",\"type\":\"INT\",\"init\":\"0\",\"comment\":\"...\"}], Enum [{\"name\":\"eIdle\",\"value\":0},{\"name\":\"eRun\",\"value\":1}]; the old object form {\"bStart\":\"BOOL\"} is not accepted (INVALID_PARAMS: object key order is not kept). An invalid entry (name not an identifier, duplicate name, missing type, unknown key) -> INVALID_PARAMS, nothing created. After saving, the declaration read back is parsed and its member order compared with the input: a difference -> MEMBER_ORDER_MISMATCH (data.expectedOrder, data.actualOrder, data.declaration; the DUT exists, fix it with WritePouCode), never success; on success data.memberOrder is the order read back. data: path, objectKind (DUT), itemType (605 Enum / 606 Struct / 607 Union / 623 Alias), declaration, memberOrder. A name that already exists or a declaration that reads back different -> DUT_CREATE_FAILED. Change it later with WritePouCode Declaration only (a DUT has no implementation). BUILD_REQUIRED (#65): a created DUT (also one whose readback failed) records kind code-changed for the open solution (data.buildRequired names the tool and the DUT; data.stateWarning when the state file could not be written): EnableConfig / PlcLogin / SendPlcProgram then refuse with BUILD_REQUIRED until BuildProject returns data.completeBuild=true. Project file (#76): CreateChild changes the .plcproj only in XAE memory, so after the readback the project files are saved (DTE Project.Save of the .tsproj, with a deadline: PROJECT_SAVE_TIMEOUT + data.saveDiagnostics) and the .plcproj is read back from disk: success only when it has a <Compile Include> with the relative path of the object <folders>\\<Name>.TcDUT (data.projectSaved: plc, plcproj, tsproj, savedFiles, verifiedFiles [file, preExisting], plcprojChanged, lastWriteBefore, lastWriteAfter, saveSec, warning); otherwise PROJECT_SAVE_FAILED (data.objectPath, createdInMemory=true, savedToDisk=false: the object exists only in XAE memory; error.hint gives the next step, also when the .plcproj cannot be located) or IDE_MODAL_DIALOG. What else Project.Save writes (measured 2026-10-28, 4026 VS2022): a dirty plain text document is NOT saved; whether unsaved content of a PLC editor (a POU edited in the GUI) is written was NOT verified. PLC still logged in (XAE: Cannot add an object because it affects a device you are currently logged into, measured 2026-10-29 4026 VS2022) -> PLC_LOGGED_IN, nothing created and no BUILD_REQUIRED recorded: PlcLogout first, then call it again."
    parameters:
      Name:
        type: string
        description: "DUT name (e.g., ST_MotorData, E_State)."
        required: true
      DutType:
        type: string
        enum: ["Struct", "Enum", "Alias", "Union"]
        description: "DUT type: Struct, Enum, Alias, Union."
        required: true
      Fields:
        type: array
        items:
          type: object
        description: "Members in declaration order (array; the order is kept and verified on readback, #47). Struct / Union: [{\"name\":\"bStart\",\"type\":\"BOOL\"},{\"name\":\"nCount\",\"type\":\"INT\",\"init\":\"0\",\"comment\":\"counter\"}] (name and type required). Enum: [{\"name\":\"eIdle\",\"value\":0},{\"name\":\"eRun\"}] (value optional). Ignored for Alias."
        required: false
      AliasType:
        type: string
        description: "Base type for Alias DUT."
        required: false

  - name: AddLibrary
    description: "Add a library reference to the PLC project: ITcPlcLibraryManager.AddLibrary(Name, Version, Vendor) on TIPC^<Plc>^<Plc> Project^References (TE1000 6.5.14). Version * = newest installed (.plcproj gets LibraryReference Include=\"<name>,newest,<vendor>\"). Already referenced (also as placeholder #<name>): success with data.alreadyPresent=true, nothing added, no BUILD_REQUIRED. Not installed: LIBRARY_ADD_FAILED with data.notInstalled=true and an install hint; nothing is saved, the .plcproj is unchanged. Several PLC projects: pass PlcProjectPath (else PLC_PROJECT_AMBIGUOUS). BUILD_REQUIRED (#65): the added reference (also when AddLibrary failed for another reason) records kind code-changed for the open solution (data.buildRequired names the tool and the library; data.stateWarning when the state file could not be written): EnableConfig / PlcLogin / SendPlcProgram then refuse with BUILD_REQUIRED until BuildProject returns data.completeBuild=true. Project file (#76): the reference is stored in the .plcproj, which is saved (DTE Project.Save of the .tsproj, deadline: PROJECT_SAVE_TIMEOUT) and read back from disk: success only when it lists a library reference named Name (data.projectSaved); otherwise PROJECT_SAVE_FAILED or IDE_MODAL_DIALOG. What else Project.Save writes (measured 2026-10-28, 4026 VS2022): a dirty plain text document is NOT saved; whether unsaved content of a PLC editor (a POU edited in the GUI) is written was NOT verified."
    parameters:
      Name:
        type: string
        description: "Library name (e.g., Tc2_Standard, Tc3_Module)."
        required: true
      Version:
        type: string
        description: "Library version. Default '*' = newest installed (the manual sample uses '*'; the project file then gets <LibraryReference Include=\"<name>,newest,<vendor>\">, measured)."
        required: false
        default: "*"
      Vendor:
        type: string
        description: "Distributor / company. Default 'Beckhoff Automation GmbH'."
        required: false
        default: "Beckhoff Automation GmbH"
      PlcProjectPath:
        type: string
        description: "PLC name (FrameworkUnitTest) or tree path (TIPC^FrameworkUnitTest^FrameworkUnitTest Project). Required when the solution has more than one PLC project."
        required: false

  - name: AddInterface
    description: "Create an INTERFACE (CreateChild 618, TE1000 v1.7.0 6.5.5) in <Plc> Project^POUs (or PlcProjectPath) and read it back: the declaration must be INTERFACE <Name> (EXTENDS <Extends> when given). Extends is one string (an array is refused by XAE, measured 2026-10-31 4026 VS2022); not an identifier list -> INVALID_PARAMS. Same checks, BUILD_REQUIRED (#65), project file save (#76, .TcIO in the .plcproj) and PLC_LOGGED_IN as AddPou; failure codes POU_CREATE_FAILED (step in the message), PROJECT_SAVE_FAILED / PROJECT_SAVE_TIMEOUT, IDE_MODAL_DIALOG. data: path, folderPath, objectKind (ITF), itemType 618, extends, declaration, projectSaved. Add methods / properties with AddPouMember ParentPath=<data.path>."
    parameters:
      Name:
        type: string
        description: "Interface name (e.g. I_Motor)."
        required: true
      Extends:
        type: string
        description: "Optional interface it extends, as one string (e.g. I_Base; several: 'I_A, I_B' is passed as given, not measured). Must be identifiers separated by commas."
        required: false
      PlcProjectPath:
        type: string
        description: "Tree path of the folder the interface is created in, e.g. TIPC^<Plc>^<Plc> Project^POUs (same as AddPou PlcProjectPath). Omit to auto-detect (<Plc> Project^POUs, else the <Plc> Project node; see data.folderPath)."
        required: false

  - name: AddPouMember
    description: "Add a Method, Property, Action, or a property Get / Set accessor below a PROGRAM / FUNCTION_BLOCK / INTERFACE (Get / Set: below a property) and read it back (CreateChild, TE1000 v1.7.0 6.5.5). ParentPath: full tree path (TIPC^<Plc>^<Plc> Project^POUs^FB_Motor; for Get / Set ...^FB_Motor^P_Speed) or a name as for GetPouCode (FB_Motor, FB_Motor.P_Speed). Sub type / vInfo (measured 2026-10-31 4026 VS2022, self-built client): FB / PROGRAM parent Method 609 {language, ReturnType, Access}, Property 611 {language, ReturnType, Access}, Action 608 {language}; INTERFACE parent Method 610 {ReturnType}, Property 612 {ReturnType}; property parent Get 613 / Set 614 {language, Access}. ReturnType is required for a Property, optional for a Method, not allowed for Action / Get / Set; Name is not needed for Get / Set. Access PUBLIC / PRIVATE / PROTECTED / INTERNAL is checked by the module (XAE makes any other value PUBLIC silently) -> POU_MEMBER_INVALID; wrong parent kind, Access / Language on an interface member -> POU_MEMBER_INVALID. Get / Set below an INTERFACE property (654 / 655) -> POU_MEMBER_UNSUPPORTED (reading such an accessor crashed VS2022); Get / Set with Access other than PUBLIC or Language other than ST -> POU_MEMBER_UNSUPPORTED (accessor-not-measured); a Method without ReturnType only with PUBLIC + ST (its language is reported, not checked). Same name below the parent (case-insensitive) -> POU_MEMBER_EXISTS (data.existingPath). Ambiguous parent name -> POU_AMBIGUOUS (data.candidates). Modal dialog -> IDE_MODAL_DIALOG, PLC logged in -> PLC_LOGGED_IN (PlcLogout first); nothing created in these cases. Success only after the new item is found with the expected ItemType and its declaration names the member, access and type (an action has none; method / action language checked). data.path = full tree path of the member: pass it as PouPath to GetPouCode / WritePouCode. A property gets no Get / Set by itself: add them with Kind Get / Set. Failure after CreateChild -> POU_MEMBER_CREATE_FAILED naming the step (the member stays in the tree). BUILD_REQUIRED (#65): a created member records kind code-changed (data.buildRequired). No project file save is needed (the parent .TcPOU is written at once, the .plcproj does not change)."
    parameters:
      ParentPath:
        type: string
        description: "The POU, interface or property that gets the member: a full tree path (TIPC^<Plc>^<Plc> Project^POUs^FB_Motor, ...^FB_Motor^P_Speed for Get / Set) or a name as for Get-TcPouCode -PouName (FB_Motor, FB_Motor.P_Speed). A name several objects carry returns POU_AMBIGUOUS with data.candidates."
        required: true
      Kind:
        type: string
        enum: ["Method", "Property", "Action", "Get", "Set"]
        description: "Method, Property, Action, Get or Set."
        required: true
      Name:
        type: string
        description: "Member name (IEC identifier). Not needed for Get / Set: an accessor is always named Get / Set."
        required: false
      ReturnType:
        type: string
        description: "Method: return type (optional; none = a method without return type). Property: its type (required). Not allowed for Action / Get / Set."
        required: false
      Access:
        type: string
        description: "PUBLIC (default), PRIVATE, PROTECTED or INTERNAL (TE1000 6.5.5 p.231). Anything else returns POU_MEMBER_INVALID. Interface members and actions take none; Get / Set only PUBLIC."
        required: false
        default: "PUBLIC"
      Language:
        type: string
        enum: ["ST", "IL", "SFC", "FBD", "CFC", "LD"]
        description: "Implementation language of a method / action / accessor: ST (default), IL, SFC, FBD, CFC or LD."
        required: false
        default: "ST"

  - name: GetLibraries
    description: "Lists the library references and placeholders of a PLC project, or with -Repository the libraries installed on this machine."
    parameters:
      Repository:
        type: boolean
        description: "List the libraries installed on this machine (ScanLibraries) instead of the project references."
        required: false
      Filter:
        type: string
        description: "Wildcard on the name (-like, case-insensitive), e.g. 'Tc2_*'. References: matches name, placeholderName or libraryName. Default: everything."
        required: false
      PlcProjectPath:
        type: string
        description: "PLC name or tree path ('TIPC^<Plc>^<Plc> Project') when the solution has more than one PLC project (otherwise PLC_PROJECT_AMBIGUOUS). -Repository needs a PLC project too (the Library Manager lives on its References node)."
        required: false

  - name: AddPlaceholder
    description: "Adds a library placeholder to the PLC project (ITcPlcLibraryManager.AddPlaceholder), saves the project file and reads it back."
    parameters:
      Placeholder:
        type: string
        description: "Placeholder name, with or without the leading '#'."
        required: true
      LibraryName:
        type: string
        description: "Default library of the placeholder (e.g. Tc2_Math). Empty: one-argument form (device placeholder)."
        required: false
      Version:
        type: string
        description: "Default library version; '*' (default) = newest installed. Only with -LibraryName."
        required: false
        default: "*"
      Distributor:
        type: string
        description: "Distributor of the default library. Default 'Beckhoff Automation GmbH'. Only with -LibraryName."
        required: false
        default: "Beckhoff Automation GmbH"
      PlcProjectPath:
        type: string
        description: "PLC name or tree path ('TIPC^<Plc>^<Plc> Project') when the solution has more than one PLC project (otherwise PLC_PROJECT_AMBIGUOUS)."
        required: false

  - name: RemoveReference
    description: "Removes a library reference or placeholder from the PLC project (ITcPlcLibraryManager.RemoveReference). Dry-run by default; backs up the .plcproj and reads back."
    parameters:
      Name:
        type: string
        description: "Library or placeholder name, with or without the leading '#' (e.g. Tc2_Math or #Tc2_Math)."
        required: true
      Kind:
        type: string
        enum: ["Library", "Placeholder"]
        description: "Library or Placeholder: which reference -Name means. Optional; needed only when a library and a placeholder share the name (Placeholder; Library is refused then, see above)."
        required: false
      DryRun:
        type: boolean
        description: "Default true: only report what would be removed. false: back up, remove, read back."
        required: false
        default: true
      PlcProjectPath:
        type: string
        description: "PLC name or tree path ('TIPC^<Plc>^<Plc> Project') when the solution has more than one PLC project (otherwise PLC_PROJECT_AMBIGUOUS)."
        required: false

  - name: InstallLibrary
    description: "Installs a .library / .compiled-library file into a library repository of this machine (ITcPlcLibraryManager.InstallLibrary). Dry-run by default; reads back with ScanLibraries."
    parameters:
      LibraryPath:
        type: string
        description: "Absolute path of the .library or .compiled-library file."
        required: true
      Repository:
        type: string
        description: "Repository name. Default 'System' (TE1000 6.5.12)."
        required: false
        default: "System"
      DryRun:
        type: boolean
        description: "Default true: only check and report. false: install and read back."
        required: false
        default: true
      PlcProjectPath:
        type: string
        description: "PLC name or tree path ('TIPC^<Plc>^<Plc> Project') when the solution has more than one PLC project (the Library Manager lives on its References node)."
        required: false

  - name: UninstallLibrary
    description: "Removes one library version from a library repository of this machine (ITcPlcLibraryManager.UninstallLibrary). Dry-run by default; exact name / version / distributor; backs up the version folder; reads back with ScanLibraries."
