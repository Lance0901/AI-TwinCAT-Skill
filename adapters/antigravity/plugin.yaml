name: twincat-automation
description: TwinCAT 3 IDE automation and PLC runtime control via PowerShell
version: 0.1.0
author: Lance0901

runtime:
  command: pwsh
  args:
    - Invoke-TwinCATAutomation.ps1
    - --operation
    - "{{operation}}"
    - --params
    - "{{params_json}}"

actions:
  - name: ConnectIde
    description: Connect to TwinCAT 3 IDE
    parameters:
      ProgId:
        type: string
        required: false
        description: COM ProgID (default TcXaeShell.DTE.17.0)

  - name: NewProject
    description: "Create new TwinCAT project. #70: only on an IDE with no solution open (otherwise SOLUTION_ALREADY_OPEN, nothing created); not offered on the MCP server"
    parameters:
      Name:
        type: string
        required: true
      Path:
        type: string
        required: false

  - name: AddPou
    description: Add POU to PLC project
    parameters:
      Name:
        type: string
        required: true
      Type:
        type: string
        enum: [Program, FunctionBlock, Function]
        required: true

  - name: WritePouCode
    description: Write Structured Text code into POU
    parameters:
      PouName:
        type: string
        required: true
      Declaration:
        type: string
        required: false
      Implementation:
        type: string
        required: false

  - name: BuildProject
    description: Build PLC project (data.buildSucceeded, data.codeErrors from the XAE Error List)

  - name: CleanProject
    description: Clean the solution and wait until SolutionBuild.BuildState is Done (CLEAN_TIMEOUT / CLEAN_FAILED / CLEAN_UNVERIFIED / LIBRARY_UNRESOLVED; data.cleanVerified)
    parameters:
      TimeoutSec:
        type: integer
        required: false
        default: 300
      AllowUnresolvedLibrary:
        type: boolean
        required: false

  - name: GetBuildErrors
    description: Read the compiler messages of the XAE Error List window (UI Automation)
    parameters:
      IncludeWarnings:
        type: boolean
        required: false
      IncludeMessages:
        type: boolean
        required: false
      TimeoutSec:
        type: integer
        required: false
        default: 30
        description: Hard limit for the UI Automation scan (5-600)

  - name: EnableConfig
    description: Activate TwinCAT configuration. Use Force for full Config->Activate->Run via ADS (no dialogs)
    parameters:
      Force:
        type: boolean
        required: false

  - name: EnterPlcOnline
    description: "Login to PLC runtime and download program (no dialogs: prompts handled by the global SilentMode; -LoginMode Regular|Download|OnlineChange = 1/4/2, SILENT flag only with -SilentFlag)"
    parameters:
      PlcProjectPath:
        type: string
        required: false
        description: Tree path to PLC project (auto-detected if omitted)

  - name: SetSystemState
    description: Switch TwinCAT system state via ADS WriteControl (no dialogs)
    parameters:
      State:
        type: string
        enum: [Run, Config]
        required: true
      AmsNetId:
        type: string
        required: false
        description: Auto-detected from IDE if omitted

  - name: ReportIssue
    description: Build a de-identified, pre-filled GitHub new-issue URL (data.url) plus the same title/body as text (data.body, complete) for a problem found while using this tool (#78). Creates nothing, no GitHub or network call, no IDE/ADS access, works while LIFECYCLE_BLOCKED. Masks user names in paths, machine names, AMS NetIds, IP/MAC, e-mail, project paths (to file name), secrets (data.masks); ExtraMask hides customer/site names. Show data.maskReport and data.body to the user; ONLY the user opens and submits the URL (the repository is public).
    parameters:
      Title:
        type: string
        required: true
        description: One-line summary (120 chars max)
      Tool:
        type: string
        required: false
        description: Tool or cmdlet that was called
      Parameters:
        type: object
        required: false
        description: Parameters of that call (object or JSON string)
      Result:
        type: object
        required: false
        description: The failing {success,error,data} result (object or JSON string); error.hint is dropped
      Expected:
        type: string
        required: false
        description: Expected behavior
      Notes:
        type: string
        required: false
        description: Steps before the call, TwinCAT/XAE version, target kind
      ExtraMask:
        type: array
        required: false
        description: Literal strings (customer/site names) to replace with <redacted>
      MaxUrlLength:
        type: integer
        required: false
        description: Encoded URL limit, 2000..8000 (default 7000)
      IncludeSolutionName:
        type: boolean
        required: false
        description: Put the solution file name into the Environment section (default left out)

  - name: ClearLifecycleBlock
    description: Remove the LIFECYCLE_BLOCKED record of one target (#68). Call ONLY after the user saw data.lifecycleBlock and agreed
    parameters:
      Reason:
        type: string
        required: true
        description: The user's approval in their words
      FallbackMethod:
        type: string
        required: true
        description: How the work continues after the block is lifted, as the user approved it (#113)
      AllowedSideEffects:
        type: array
        items:
          type: string
        required: true
        description: Side effects the user allowed, one entry each; exactly [none] when none, never none with another entry (#113)
      MaxVerifyLevel:
        type: string
        enum: [None, SystemState, PlcState, VariableRead, TestObserved]
        required: true
        description: The highest layer the verification after this clear will reach; results must not claim more than it (#113). Missing, empty or invalid fields return LIFECYCLE_RECEIPT_INCOMPLETE
      AmsNetId:
        type: string
        required: false
        description: Default IDE target, then ADS session

  - name: ConnectAds
    description: Connect to PLC runtime via ADS. AmsNetId auto-detected from IDE target.
    parameters:
      AmsNetId:
        type: string
        required: false
        description: Auto-detected from IDE if omitted
      Port:
        type: integer
        default: 851

  - name: ReadVariable
    description: Read PLC variable
    parameters:
      Path:
        type: string
        required: true

  - name: WriteVariable
    description: Write PLC variable
    parameters:
      Path:
        type: string
        required: true
      Value:
        required: true

  - name: SetPlcState
    description: Set PLC state (Run/Stop/Reset) via ADS
    parameters:
      State:
        type: string
        enum: [Run, Stop, Reset]
        required: true

  - name: RunTestCycle
    description: Full Build-Test cycle
    parameters:
      TestCases:
        type: array
        required: true

  - name: ListOperations
    description: List all available operations
